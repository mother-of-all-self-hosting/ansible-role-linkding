---
- name: Wait for the linkding systemd service to become active (up to 180s)
  ansible.builtin.systemd_service:
    name: linkding.service
  register: linkding_service
  until: linkding_service.status.ActiveState == 'active'
  retries: 36
  delay: 5
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the linkding systemd service is active
  ansible.builtin.assert:
    that: linkding_service.status.ActiveState == 'active'
    fail_msg: "linkding.service is not active ({{ linkding_service.status.ActiveState }})"
    success_msg: "linkding.service is active"

- name: Retrieve the linkding systemd service log for debugging
  when: linkding_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu linkding.service
  changed_when: false

# linkding is a Django application, and its login page renders without ever
# touching the database: a container whose database is unreachable still
# answers `/` with a 302 and `/login/` with a 200. Both were confirmed
# against sissbruecker/linkding:1.46.2 pointed at a nonexistent database
# host, where uWSGI came up and served happily while every migration had
# failed. `/health` is the endpoint that opens a database connection - it
# calls ensure_connection() and answers 500 "unhealthy" when that fails -
# so it is the only readiness gate here worth waiting on.
- name: Wait for linkding to report itself healthy (up to 10m)
  ansible.builtin.uri:
    url: "{{ linkding_verify_base_url }}/health"
    method: GET
    status_code: [200, 500, 502, 503]
    return_content: true
  register: linkding_health
  until: linkding_health.status == 200 and linkding_health.json.status | default('') == 'healthy'
  retries: 120
  delay: 5

- name: Assert linkding reports a working database connection
  ansible.builtin.assert:
    that:
      - linkding_health.status == 200
      - linkding_health.json.status == 'healthy'
    fail_msg: >-
      linkding did not report itself healthy
      (status {{ linkding_health.status | default('no response') }},
      body {{ linkding_health.json | default('none') }})
    success_msg: "linkding reports a working database connection"

# A second, independent reading of the same fact. /health is served by the
# Django application; this file is shipped inside the image that the systemd
# unit actually started, so the two together rule out the endpoint being
# answered by something other than the image the role deployed.
- name: Read the version file shipped inside the linkding image
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ linkding_defaults.linkding_identifier }}"
      - cat
      - /etc/linkding/version.txt
  register: linkding_version_file
  changed_when: false

- name: Assert the running linkding is the version this role installs
  ansible.builtin.assert:
    that:
      - linkding_health.json.version == linkding_defaults.linkding_version | string
      - linkding_version_file.stdout | trim == linkding_defaults.linkding_version | string
    fail_msg: "linkding reports {{ linkding_version_file.stdout | trim | default('none') }}, expected {{ linkding_defaults.linkding_version }}"
    success_msg: "linkding reports {{ linkding_version_file.stdout | trim }}"
